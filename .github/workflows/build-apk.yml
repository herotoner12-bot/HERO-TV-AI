
name: Build HERO TV AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "HERO-TV-AI-source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q HERO-TV-AI-source.zip -d source
          test -f source/HERO-TV-AI/settings.gradle.kts

      - name: Build debug APK
        working-directory: source/HERO-TV-AI
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HERO-TV-AI-debug
          path: source/HERO-TV-AI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
